syntax = "proto3";

package messenger.history.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/messenger-go-team/messenger/api/gen/history/v1;historyv1";

// HistoryService is internal to chat -> history. See README.md for the MVP RPCs.
service HistoryService {
  // SaveMessage checks membership and commits before returning OK.
  // Same key and body return the original result with duplicate=true;
  // the same key with a different body returns ALREADY_EXISTS.
  rpc SaveMessage(SaveMessageRequest) returns (SaveMessageResponse);
  // GetChatMembers authorizes requester_id and returns current routing targets.
  rpc GetChatMembers(GetChatMembersRequest) returns (GetChatMembersResponse);
  // CheckMembership is a snapshot, not authorization for a subsequent write.
  rpc CheckMembership(CheckMembershipRequest) returns (CheckMembershipResponse);
  // AdvanceReceipt is available for personal chats in stage 2.
  // Validate actor membership, chat type and seq in the same transaction as the
  // update. Return OK only after commit, including for a repeat or older seq.
  // INVALID_ARGUMENT: malformed request (UUID, kind or missing seq).
  // NOT_FOUND: missing chat. PERMISSION_DENIED: actor is not a member.
  // Check membership before reporting chat type or bounds based on last_seq.
  // FAILED_PRECONDITION: chat is not personal. OUT_OF_RANGE: seq outside
  // 0..min(chat.last_seq, 9007199254740991). A seq need not identify a row.
  // UNAVAILABLE: storage unavailable or commit result unknown. Deadline and
  // cancellation may leave the caller uncertain whether the update committed.
  rpc AdvanceReceipt(AdvanceReceiptRequest) returns (AdvanceReceiptResponse);
  // ListPresencePeers returns a point-in-time authorization snapshot for Chat.
  // The requester must be a current member of each returned peer's personal chat.
  // INVALID_ARGUMENT: malformed requester UUID. UNAVAILABLE: storage unavailable.
  rpc ListPresencePeers(ListPresencePeersRequest) returns (ListPresencePeersResponse);
  // AuthorizePresenceDelivery rechecks candidates and orders a short write
  // window against any concurrent change to the authorizing personal chats.
  // Chat may write only within 250 ms from the start of this request, including
  // queue time and the socket write. Never extend the window on receipt.
  rpc AuthorizePresenceDelivery(AuthorizePresenceDeliveryRequest) returns (AuthorizePresenceDeliveryResponse);
}

message SaveMessageRequest {
  // Required UUID of a chat already created through history REST.
  string chat_id = 1;
  // Required UUID from the JWT verified by chat, never from WS payload.
  string sender_id = 2;
  // Required client-generated UUID v4, unchanged across retries.
  string client_msg_id = 3;
  // UTF-8 plain text: 1..4096 code points, not only Unicode White_Space.
  // History rejects U+0000 with INVALID_ARGUMENT before storage.
  // Preserve exactly: no trimming or Unicode normalization.
  string body = 4;
}

message SaveMessageResponse {
  // Required server UUID, stable across duplicates.
  string message_id = 1;
  // Monotonic within chat: 1..9007199254740991 (safe for external JSON).
  int64 seq = 2;
  // Required server time of the first save, stable across duplicates.
  google.protobuf.Timestamp created_at = 3;
  // false for the first committed insert; true for an identical retry.
  bool duplicate = 4;
}

message GetChatMembersRequest {
  // Required UUID.
  string chat_id = 1;
  // Required authenticated user's UUID from JWT; must belong to this chat.
  string requester_id = 2;
}

message GetChatMembersResponse {
  // Unique current chat_members.user_id values, including the requester.
  // Sorted by canonical UUID string ascending; two for a personal chat.
  repeated string user_ids = 1;
}

message CheckMembershipRequest {
  // Required UUID.
  string chat_id = 1;
  // Required authenticated user's UUID from JWT.
  string user_id = 2;
}

message CheckMembershipResponse {
  // false for a non-member of an existing chat; storage errors are not false.
  bool is_member = 1;
}

enum ReceiptKind {
  RECEIPT_KIND_UNSPECIFIED = 0;
  RECEIPT_KIND_DELIVERED = 1;
  RECEIPT_KIND_READ = 2;
}

message AdvanceReceiptRequest {
  // Required canonical, non-zero UUID of the chat.
  string chat_id = 1;
  // Required canonical, non-zero UUID from the access JWT verified by Chat.
  string actor_id = 2;
  // Only DELIVERED and READ are accepted.
  ReceiptKind kind = 3;
  // Must be present. Zero is a valid cursor, distinct from an omitted field.
  optional int64 seq = 4;
}

message AdvanceReceiptResponse {
  // The actor's committed public cursors after the operation, initially zero.
  // Neither cursor is initialized or derived from the legacy MVP columns.
  // DELIVERED takes max(old delivered, seq) and leaves both read cursors alone.
  // READ takes max(current, seq) for public delivered, public read and private
  // last_read_seq (unread_count) in one transaction. If retaining both MVP
  // columns, also set private last_delivered_seq to
  // max(previous private delivered, new private read) in that transaction.
  // 0 <= public read <= public delivered <= chat.last_seq at commit.
  int64 last_delivered_seq = 1;
  int64 last_read_seq = 2;
  // True if this transaction increased public last_delivered_seq, compared
  // with its value before the update. False for a repeat without advancement.
  bool delivered_advanced = 3;
}

message ListPresencePeersRequest {
  // Required canonical, non-zero UUID from the access JWT verified by Chat.
  string requester_id = 1;
}

message ListPresencePeersResponse {
  // Unique peer UUIDs sorted in canonical order. Each shares a current personal
  // chat with exactly two members, including the requester. An empty list is OK.
  repeated string user_ids = 1;
}

message AuthorizePresenceDeliveryRequest {
  // Required canonical, non-zero UUID from the access JWT verified by Chat.
  string requester_id = 1;
  // 1..128 distinct canonical, non-zero peer UUIDs, excluding requester_id.
  repeated string user_ids = 2;
}

message AuthorizePresenceDeliveryResponse {
  // Authorized subset of the request. A missing peer may not be sent.
  repeated string user_ids = 1;
}
