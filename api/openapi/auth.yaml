openapi: 3.1.0
info:
  title: Messenger Auth API
  version: 0.1.0
  description: >-
    Контракт auth-сервиса. Внешние операции доступны клиенту через HTTPS.
    Внутренняя операция получения пользователя предназначена только для
    взаимодействия сервисов во внутренней сети.
servers:
  - url: /
    description: Относительно внешнего домена; маршрутизацию выполняет Nginx.
tags:
  - name: Auth
    description: Регистрация, вход и управление refresh-токеном.
  - name: Profile
    description: Профиль текущего пользователя.
  - name: Users
    description: Поиск пользователей.
  - name: Contacts
    description: Контакты текущего пользователя.
  - name: Internal
    description: Внутренние вызовы сервисов; не предназначены для браузера.

paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Зарегистрировать пользователя
      description: >-
        Username уникален без учёта регистра; допустимы латинские буквы, цифры
        и подчёркивание. Создание пользователя не создаёт сессию: для получения
        access-токена клиент вызывает /auth/login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: alice_1
              password: correct-horse-battery
      responses:
        '201':
          description: Пользователь создан без автоматического входа.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 8f4f2c3a-9ad8-4c6a-8f90-3d24b54a21a0
                username: alice_1
                created_at: '2026-11-07T12:00:00Z'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Войти по username и паролю
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: alice_1
              password: correct-horse-battery
      responses:
        '200':
          description: >-
            Access-токен возвращён в JSON; непрозрачный refresh-токен установлен
            только в HttpOnly cookie и недоступен JavaScript-коду браузера.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Обновить и ротировать токены
      description: >-
        Refresh-токен читается из HttpOnly cookie. При успехе прежний токен
        становится недействительным, а сервер устанавливает новый cookie.
      responses:
        '200':
          description: Access-токен обновлён; refresh-токен ротирован в cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Отозвать refresh-токен
      description: Refresh-токен читается из HttpOnly cookie.
      responses:
        '204':
          description: Refresh-токен отозван и cookie удалён.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedRefreshTokenCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me:
    get:
      tags: [Profile]
      operationId: getMe
      summary: Получить профиль текущего пользователя
      security:
        - accessToken: []
      responses:
        '200':
          description: Профиль текущего пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/search:
    get:
      tags: [Users]
      operationId: searchUsers
      summary: Найти пользователей по префиксу username
      description: >-
        Возвращает не более 20 совпадений, начиная с заданного префикса.
        Сравнение регистронезависимое; в ответе сохраняется исходное написание
        username.
      security:
        - accessToken: []
      parameters:
        - name: prefix
          in: query
          required: true
          description: Начало username; сравнение регистронезависимое.
          schema:
            type: string
            minLength: 1
            maxLength: 32
            pattern: '^[A-Za-z0-9_]{1,32}$'
          example: ali
      responses:
        '200':
          description: Найденные пользователи (максимум 20).
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    maxItems: 20
                    items:
                      $ref: '#/components/schemas/UserSummary'
              examples:
                found:
                  summary: Совпадение по префиксу ali без учёта регистра
                  value:
                    users:
                      - id: 23968cc7-c30c-47b0-a741-6b81249aa5e7
                        username: Alice_1
                empty:
                  summary: Совпадений нет
                  value:
                    users: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /contacts:
    get:
      tags: [Contacts]
      operationId: listContacts
      summary: Получить контакты текущего пользователя
      description: >-
        Возвращает весь односторонний список пользователя из access JWT,
        без пагинации. Сортировка по возрастанию ASCII lower-case username;
        в ответе сохраняется исходное написание. Принадлежность к контактам
        определяется по id, отдельное поле is_contact не требуется.
      security:
        - accessToken: []
      responses:
        '200':
          description: Список контактов.
          content:
            application/json:
              schema:
                type: object
                required: [contacts]
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSummary'
              examples:
                contacts:
                  summary: Контакты отсортированы без учёта регистра
                  value:
                    contacts:
                      - id: 23968cc7-c30c-47b0-a741-6b81249aa5e7
                        username: Alice_1
                      - id: 8f4f2c3a-9ad8-4c6a-8f90-3d24b54a21a0
                        username: bob_2
                empty:
                  summary: Список контактов пуст
                  value:
                    contacts: []
        '401':
          $ref: '#/components/responses/Unauthorized'

  /contacts/{contact_id}:
    parameters:
      - name: contact_id
        in: path
        required: true
        description: UUID пользователя, которого добавляют в контакты или удаляют.
        schema:
          type: string
          format: uuid
    put:
      tags: [Contacts]
      operationId: addContact
      summary: Добавить пользователя в контакты
      description: >-
        Добавляет контакт только в список пользователя из access JWT;
        обратная запись не создаётся. Повторное добавление не создаёт дубликат.
        Несуществующий пользователь даёт 404, собственный contact_id или
        некорректный UUID дают 422. Контакты не определяют права на чат.
      security:
        - accessToken: []
      responses:
        '204':
          description: Контакт добавлен или уже существовал.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Contacts]
      operationId: removeContact
      summary: Удалить пользователя из контактов
      description: >-
        Удаляет контакт только из списка пользователя из access JWT.
        Отсутствие записи, включая собственный contact_id, возвращает 204;
        некорректный UUID даёт 422. Чат, история и chat_members не изменяются.
      security:
        - accessToken: []
      responses:
        '204':
          description: Контакт удалён или уже отсутствовал.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /internal/users/{user_id}:
    get:
      tags: [Internal]
      operationId: getUserByIdInternal
      summary: Получить пользователя по ID для внутреннего сервиса
      servers:
        - url: http://auth:8080
          description: >-
            Адрес auth-сервиса во внутренней сети Compose. Внешний Nginx этот
            маршрут не публикует.
      description: >-
        Только для внутренних сервисов, включая history. Не публиковать этот
        маршрут через внешний Nginx. Предлагаемая авторизация — отдельный
        opaque bearer-секрет из переменной окружения AUTH_INTERNAL_TOKEN;
        конкретный способ межсервисной авторизации требует подтверждения команды.
      security:
        - internalServiceToken: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Публичные поля пользователя, необходимые history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access JWT, подписанный HS256. Claims: sub (UUID пользователя), iat и
        exp; срок действия около 15 минут. Секрет HS256 хранится в окружении
        и должен быть не короче 32 байт. Проверка выполняется общим Go-пакетом.
    internalServiceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Предлагаемый внутренний токен сервиса; см. описание операции.

  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_]{3,32}$'
          description: >-
            Уникален без учёта регистра. В ответах сохраняется написание,
            переданное при регистрации.
          example: alice_1
        password:
          type: string
          minLength: 8
          writeOnly: true
          format: password
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_]{3,32}$'
          description: Сравнивается без учёта регистра.
        password:
          type: string
          minLength: 8
          writeOnly: true
          format: password
    AccessTokenResponse:
      type: object
      additionalProperties: false
      required: [token_type, access_token, expires_in]
      properties:
        token_type:
          type: string
          const: Bearer
        access_token:
          type: string
          description: JWT с алгоритмом подписи HS256.
        expires_in:
          type: integer
          const: 900
          description: Срок действия access-токена в секундах (около 15 минут).
    User:
      type: object
      additionalProperties: false
      required: [id, username, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        created_at:
          type: string
          format: date-time
    UserSummary:
      type: object
      additionalProperties: false
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки.
          example: validation_error
        message:
          type: string
          description: Краткое описание ошибки для человека.
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, reason]
            properties:
              field:
                type: string
              reason:
                type: string
        request_id:
          type: string
          description: Идентификатор запроса для поиска в логах, если доступен.

  headers:
    RefreshTokenCookie:
      description: >-
        Непрозрачный refresh-токен с временем жизни около 30 дней. Браузер
        отправляет cookie только на /auth; JavaScript-код не может его прочитать.
      schema:
        type: string
        example: refresh_token=opaque-value; Max-Age=2592000; Path=/auth; HttpOnly; Secure; SameSite=Lax
    ClearedRefreshTokenCookie:
      description: Удаляет refresh cookie в браузере.
      schema:
        type: string
        example: refresh_token=; Max-Age=0; Path=/auth; HttpOnly; Secure; SameSite=Lax

  responses:
    Unauthorized:
      description: Отсутствующий, недействительный или истёкший токен либо неверные учётные данные.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: invalid_credentials
            message: Неверный username или пароль.
    Conflict:
      description: Username уже занят.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: username_taken
            message: Username уже занят.
    NotFound:
      description: Пользователь не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: user_not_found
            message: Пользователь не найден.
    ValidationError:
      description: Запрос не проходит проверку полей.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: validation_error
            message: Запрос содержит некорректные поля.
            details:
              - field: username
                reason: Длина 3–32 символа; допустимы латинские буквы, цифры и подчёркивание.
