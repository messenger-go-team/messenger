events {}

http {
    include /etc/nginx/mime.types;
    include /etc/nginx/messenger/snippets/backends.conf;
    access_log off;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        absolute_redirect off;

        include /etc/nginx/messenger/snippets/auth-locations.conf;

        location = /chats {
            proxy_pass http://history_backend;
        }

        location /chats/ {
            proxy_pass http://history_backend;
        }

        location = /later {
            proxy_pass http://history_backend;
        }

        location /later/ {
            proxy_pass http://history_backend;
        }

        location = /ws {
            # Only this test gateway knows the browser's dynamically bound port.
            if ($http_host !~ "^127\.0\.0\.1:[0-9]+$") { return 403; }
            set $browser_origin "http://$http_host";
            if ($http_origin != $browser_origin) { return 403; }

            proxy_pass http://chat_backend;
            proxy_http_version 1.1;
            proxy_set_header Origin http://e2e-gateway;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
        }

        location = /app {
            return 302 /app/;
        }

        location /app/assets/ {
            try_files $uri =404;
        }

        location /app/ {
            try_files $uri $uri/ /app/index.html;
        }

        location / {
            return 404;
        }
    }
}
