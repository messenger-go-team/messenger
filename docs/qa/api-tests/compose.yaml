services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: api-fixture-only
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-api.sql:ro
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
  init:
    image: ${API_TEST_IMAGE:-messenger-api-tests:local}
    build:
      context: ../../..
      dockerfile: docs/qa/api-tests/Dockerfile
    user: "0:0"
    command: ["node", "run.cjs", "--init"]
    environment: &fixture-env
      AUTH_DATABASE_URL: postgres://postgres:api-fixture-only@postgres:5432/api_auth?sslmode=disable
      HISTORY_DATABASE_URL: postgres://postgres:api-fixture-only@postgres:5432/api_history?sslmode=disable
      AUTH_INTERNAL_TOKEN: t49-internal-test-only-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - certs:/certs
      - ./reports:/reports
  auth:
    build:
      context: ../../..
      dockerfile: services/auth/Dockerfile
    environment:
      AUTH_DATABASE_URL: postgres://api_auth_runtime:api-auth-runtime-only@postgres:5432/api_auth?sslmode=disable
      JWT_SECRET: t49-jwt-test-only-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      AUTH_INTERNAL_TOKEN: t49-internal-test-only-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    depends_on:
      init: {condition: service_completed_successfully}
  history:
    build:
      context: ../../..
      dockerfile: services/history/Dockerfile
    environment:
      HISTORY_DATABASE_URL: postgres://api_history_runtime:api-history-runtime-only@postgres:5432/api_history?sslmode=disable
      AUTH_BASE_URL: http://auth:8080
      AUTH_INTERNAL_TOKEN: t49-internal-test-only-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      JWT_SECRET: t49-jwt-test-only-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    depends_on:
      init: {condition: service_completed_successfully}
  gateway:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/certs:ro
    depends_on:
      auth: {condition: service_started}
      history: {condition: service_started}
  tests:
    image: ${API_TEST_IMAGE:-messenger-api-tests:local}
    environment:
      <<: *fixture-env
      NODE_EXTRA_CA_CERTS: /certs/ca.pem
      FIXTURE_BIN: /usr/local/bin/api-fixture
      API_REPORT_DIR: /reports
    depends_on:
      gateway: {condition: service_started}
    volumes:
      - certs:/certs:ro
      - ./reports:/reports
volumes:
  certs:
