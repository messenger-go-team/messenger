events {}
http {
  access_log off;
  server {
    listen 8443 ssl;
    server_name gateway;
    ssl_certificate /certs/server.pem;
    ssl_certificate_key /certs/server.key;
    location /auth/ { proxy_pass http://auth:8080; }
    location = /me { proxy_pass http://auth:8080; }
    location /users/ { proxy_pass http://auth:8080; }
    location /contacts { proxy_pass http://auth:8080; }
    location /chats { proxy_pass http://history:8080; }
    location /later { proxy_pass http://history:8080; }
    location /internal/ { return 404; }
    location / { return 404; }
  }
}
