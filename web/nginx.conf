server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: API/WS на этом же origin проксирует внешний ingress, не этот контейнер.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        default_type text/plain;
        return 200 'ok\n';
    }
}
