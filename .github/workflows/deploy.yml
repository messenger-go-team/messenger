name: Deploy staging

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Go CI", "Frontend CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    name: Select a verified main commit
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
          || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Check main and both CI runs
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          STAGING_CD_ENABLED: ${{ vars.STAGING_CD_ENABLED }}
        run: |
          if [[ "$STAGING_CD_ENABLED" != true ]]; then
            echo "Staging deployment is disabled"
            exit 0
          fi
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" != "$RELEASE_SHA" ]]; then
            echo "Skipping superseded commit $RELEASE_SHA"
            exit 0
          fi
          for workflow in ci.yml frontend-ci.yml; do
            result=$(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?branch=main&event=push&head_sha=$RELEASE_SHA&per_page=1" \
              --jq '.workflow_runs[0] | if .status == "completed" then .conclusion else "pending" end')
            if [[ "$result" != success ]]; then
              echo "Skipping $RELEASE_SHA: $workflow is ${result:-pending}"
              exit 0
            fi
          done
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    name: Release to staging
    needs: preflight
    if: needs.preflight.outputs.sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      deployments: write
    environment:
      name: staging
      deployment: false
    concurrency:
      # A superseded SHA cannot cancel the pending job for another SHA.
      group: deploy-staging-${{ needs.preflight.outputs.sha }}
      cancel-in-progress: false
    steps:
      - name: Run the restricted staging deploy command
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
          STAGING_CD_ENABLED: ${{ vars.STAGING_CD_ENABLED }}
          STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          STAGING_KNOWN_HOSTS: ${{ vars.STAGING_KNOWN_HOSTS }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$STAGING_CD_ENABLED" != true ]]; then
            echo "Staging deployment is disabled"
            exit 0
          fi
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" != "$RELEASE_SHA" ]]; then
            echo "Skipping superseded commit $RELEASE_SHA after waiting in queue"
            exit 0
          fi
          : "${STAGING_SSH_KEY:?missing staging deployment key}"
          : "${STAGING_KNOWN_HOSTS:?missing pinned staging host key}"
          [[ "$STAGING_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          umask 077
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$STAGING_SSH_KEY" > "$key_dir/id"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$key_dir/known_hosts"
          unset STAGING_SSH_KEY
          set -o pipefail
          ssh -n -T -i "$key_dir/id" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$key_dir/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=3 \
            "messenger-stage@$STAGING_SSH_HOST" "deploy $RELEASE_SHA" |
            tee "$key_dir/result"
          case "$(tail -n 1 "$key_dir/result")" in
            "STAGING_RESULT deployed $RELEASE_SHA")
              echo "deployed_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT" ;;
            "STAGING_RESULT already_active $RELEASE_SHA"|"STAGING_RESULT skipped $RELEASE_SHA")
              ;;
            *)
              echo "VPS did not confirm the release result" >&2
              exit 1 ;;
          esac

      - name: Record the confirmed staging deployment
        if: steps.release.outputs.deployed_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.release.outputs.deployed_sha }}
        run: |
          set -o pipefail
          deployment_id=$(jq -nc --arg ref "$RELEASE_SHA" \
            '{ref:$ref,environment:"staging",auto_merge:false,required_contexts:[],production_environment:false}' |
            gh api -X POST "repos/$GH_REPO/deployments" --input - --jq '.id')
          gh api -X POST "repos/$GH_REPO/deployments/$deployment_id/statuses" \
            -f state=success -f environment_url=https://staging.tidingm.ru \
            -f log_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --silent
