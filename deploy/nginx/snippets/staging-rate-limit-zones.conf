# Include in http {} on the public staging edge.
# Empty keys skip accounting. $binary_remote_addr uses Nginx's client address.
map "$request_method:$uri" $messenger_staging_login_ip {
    default "";
    ~^POST:/auth/login$ $binary_remote_addr;
}

map "$request_method:$uri" $messenger_staging_register_ip {
    default "";
    ~^POST:/auth/register$ $binary_remote_addr;
}

map $http_upgrade $messenger_staging_is_websocket {
    default 0;
    ~*(^|,)[[:blank:]]*websocket[[:blank:]]*(,|$) 1;
}

map "$request_method:$uri:$messenger_staging_is_websocket" $messenger_staging_ws_ip {
    default "";
    ~^GET:/ws:1$ $binary_remote_addr;
}

limit_req_zone $messenger_staging_login_ip zone=messenger_staging_login:1m rate=30r/m;
limit_req_zone $messenger_staging_register_ip zone=messenger_staging_register:1m rate=12r/m;
limit_req_zone $messenger_staging_ws_ip zone=messenger_staging_ws:1m rate=120r/m;
