# Include inside the public server. Define auth_backend as the internal Auth
# upstream (auth:8080 in Compose). Auth's own port must not be publicly exposed.
# Internal routes stay unavailable even when a caller knows a service token.
location = /internal { return 404; }
location ^~ /internal/ { return 404; }

# Preserve the original URI for Auth validation. Adding a URI to proxy_pass
# would replace the normalized path, including encoded separators/dot segments.
location /auth/ { proxy_pass http://auth_backend; }
location = /me { proxy_pass http://auth_backend; }
location = /users/search { proxy_pass http://auth_backend; }
location = /contacts { proxy_pass http://auth_backend; }
location /contacts/ { proxy_pass http://auth_backend; }
