# Include inside the public server. Define auth_backend as the internal Auth
# upstream (auth:8080 in Compose). Auth's own port must not be publicly exposed.
# Internal routes stay unavailable even when a caller knows a service token.
location = /internal { return 404; }
location ^~ /internal/ { return 404; }

location /auth/ { proxy_pass http://auth_backend/auth/; }
location = /me { proxy_pass http://auth_backend/me; }
location = /users/search { proxy_pass http://auth_backend/users/search; }
location = /contacts { proxy_pass http://auth_backend/contacts; }
location /contacts/ { proxy_pass http://auth_backend/contacts/; }
