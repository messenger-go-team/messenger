events {}

http {
    include /etc/nginx/mime.types;
    access_log off;
    resolver 127.0.0.11 valid=3s ipv6=off;

    upstream auth_backend {
        zone qa_auth_upstream 64k;
        server auth:8080 resolve;
    }
    upstream history_backend {
        zone qa_history_upstream 64k;
        server history:8080 resolve;
    }
    upstream chat_backend {
        zone qa_chat_upstream 64k;
        server chat:8080 resolve;
    }
    upstream fault_backend {
        zone qa_fault_upstream 64k;
        server faults:8080 resolve;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # The cookie selects the test transport only for the selected browser profile.
    map $cookie_messenger_qa_faults $history_target {
        default history_backend;
        1 fault_backend;
    }
    map "$cookie_messenger_qa_faults:$arg_qa_fault" $chat_target {
        default chat_backend;
        "1:" fault_backend;
        ":1" fault_backend;
        "1:1" fault_backend;
    }

    server {
        listen 8080;
        root /srv/www;
        absolute_redirect off;
        include /etc/nginx/messenger/snippets/auth-locations.conf;

        location = / { return 302 /app/; }
        location = /app { return 302 /app/; }
        location /app/assets/ { try_files $uri =404; }
        location /app/ { try_files $uri $uri/ /app/index.html; }
        location = /revision.txt { add_header Cache-Control no-store; }

        location = /chats { proxy_pass http://$history_target; }
        location = /chats/personal { proxy_pass http://$history_target; }
        location ~ ^/chats/[^/]+/(messages|read|receipts|messages/[^/]+/context)$ {
            proxy_pass http://$history_target;
        }
        location = /later { proxy_pass http://$history_target; }
        location /later/ { proxy_pass http://$history_target; }

        location = /ws {
            proxy_pass http://$chat_target;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin $http_origin;
            proxy_read_timeout 75s;
        }
        location / { return 404; }
    }
}
