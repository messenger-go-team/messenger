events {}

http {
    include /etc/nginx/messenger/snippets/backends.conf;

    server {
        listen 8080;
        include /etc/nginx/messenger/snippets/public-locations.conf;
    }

    # Verify reload from inside this container. The port is not published.
    server {
        listen 127.0.0.1:8081;
        include /etc/nginx/messenger/snippets/release-marker.conf;
    }
}
