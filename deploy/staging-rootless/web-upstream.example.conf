# Пример для devops (#46): подключить SPA после сборки web/Dockerfile.
#
# 1) В backends.conf (или overlay):
#    upstream web_backend { server web:8080; }
# 2) В compose: сервис web с образом messenger36-stage-web:${SHA}
# 3) Заменить в public-locations.conf блок `location / { return 404; }` на:

location / {
    proxy_pass http://web_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
